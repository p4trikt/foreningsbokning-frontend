<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mina bokningar - Skånebutikenbokning</title>
<link rel="stylesheet" href="css/style.css?v=13">
</head>
<body>
<header>
    <div class="logo-rad">
        <img class="bi-logotyp" src="img/bi-logotyp.png" alt="Sverigedemokraterna">
        <div class="delare"></div>
        <img class="sd-logotyp" src="img/sd-logotyp-vit.png" alt="Sverigedemokraterna">
    </div>
    <nav>
        <a href="boka.html">Boka</a>
        <a href="mina-bokningar.html" class="aktiv">Mina bokningar</a>
        <button onclick="loggaUt()">Logga ut</button>
    </nav>
</header>
<main>
    <div id="meddelande-yta"></div>
    <div class="kort">
        <h2>Mina bokningar</h2>
        <table id="bokningar-tabell">
            <thead>
                <tr><th>Objekt</th><th>Datum</th><th>Status</th><th></th></tr>
            </thead>
            <tbody id="bokningar-body"></tbody>
        </table>
        <p id="tom-meddelande" style="display:none;">Ni har inga bokningar ännu.</p>
    </div>
</main>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
async function init() {
    const status = await kollaInloggning();
    if (!status.inloggad) { window.location.href = SITE_BASE + 'index.html'; return; }
    await laddaBokningar();
}

async function laddaBokningar() {
    const svar = await api('/api/mina-bokningar');
    const body = document.getElementById('bokningar-body');
    const bokningar = svar.data || [];

    if (!bokningar.length) {
        document.getElementById('tom-meddelande').style.display = 'block';
        document.getElementById('bokningar-tabell').style.display = 'none';
        return;
    }

    body.innerHTML = bokningar.map(b => `
        <tr>
            <td>${b.objekt_namn}</td>
            <td>${b.start_datum} - ${b.slut_datum}</td>
            <td><span class="status status-${b.status}">${statusText(b.status)}</span></td>
            <td>
                ${(b.status === 'vantande' || b.status === 'bekraftad')
                    ? `<button class="knapp knapp-fara knapp-liten" onclick="avboka(${b.id})">Avboka</button>`
                    : ''}
            </td>
        </tr>
    `).join('');
}

async function avboka(id) {
    if (!confirm('Vill ni avboka den här bokningen?')) return;
    const svar = await api(`/api/bokningar/${id}/avboka`, 'POST');
    if (svar.ok) {
        visaMeddelande(svar.data.meddelande, 'ok');
        laddaBokningar();
    } else {
        visaMeddelande(svar.data.fel || 'Kunde inte avboka.', 'fel');
    }
}

init();
</script>
</body>
</html>
